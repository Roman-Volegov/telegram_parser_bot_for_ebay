name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check bot tests
      - run: python -m pytest -q
      - run: pip-audit -r requirements.txt
      - run: ETSY_NOVNC_TOKEN=ci-token-with-at-least-32-characters docker compose config -q
