# Отдельный проект: не пересекается с ~/cdek-bot
name: ebay-poshmark-bot

services:
  bot:
    build: .
    container_name: ebay-poshmark-bot
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      etsy-browser:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ebay_bot_data:/app/data
    mem_limit: 900m
    mem_reservation: 512m
    cpus: 0.75
    pids_limit: 256
    expose:
      - "8080"
    environment:
      DATABASE_PATH: /app/data/bot.db
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      REDIS_URL: redis://redis:6379/0
      ETSY_BROWSER_RUNTIME: "disabled"
      ETSY_BROWSER_CDP_URL: http://etsy-browser:9222
      ETSY_BROWSER_CONTROL_URL: http://etsy-browser:9223
      ETSY_NOVNC_TOKEN: ${ETSY_NOVNC_TOKEN:?Set ETSY_NOVNC_TOKEN in .env}
      ETSY_NOVNC_TTL_SEC: ${ETSY_NOVNC_TTL_SEC:-43200}
    # прямой доступ оставляем на 18080 (HTTP) для отладки/health
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  etsy-browser:
    build: .
    container_name: ebay-poshmark-etsy-browser
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    command: ["python", "-m", "bot.etsy_browser_service"]
    volumes:
      # Сохраняем существующий профиль/cookies; browser-сервис не обращается к БД.
      - ebay_bot_data:/app/data
    shm_size: "512mb"
    mem_limit: 700m
    mem_reservation: 384m
    cpus: 0.60
    pids_limit: 512
    environment:
      ETSY_BROWSER_RUNTIME: "managed"
      ETSY_BROWSER_PROFILE_DIR: /app/data/etsy-browser-profile
      ETSY_BROWSER_PROXY: ${HTTP_PROXY:-}
      ETSY_BROWSER_PID_THRESHOLD_PERCENT: "80"
      ETSY_BROWSER_PID_THRESHOLD_CHECKS: "3"
      ETSY_BROWSER_WATCH_INTERVAL_SEC: "5"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "6080"
      - "9222"
      - "9223"
    # Только локальная диагностика noVNC через SSH-туннель.
    ports:
      - "127.0.0.1:16080:6080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9223/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    container_name: ebay-poshmark-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ebay_redis_data:/data
    mem_limit: 96m
    cpus: 0.10
    pids_limit: 64
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  caddy:
    image: caddy:2.11.4-alpine
    container_name: ebay-poshmark-caddy
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_healthy
      etsy-browser:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.20
    pids_limit: 64
    ports:
      - "80:80"
      - "443:443"
    environment:
      MINIAPP_DOMAIN: ${MINIAPP_DOMAIN:?Set MINIAPP_DOMAIN in .env}
      ETSY_NOVNC_TOKEN: ${ETSY_NOVNC_TOKEN:?Set ETSY_NOVNC_TOKEN in .env}
      XUI_ACME_HOST: ${XUI_ACME_HOST:?Set XUI_ACME_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./acme-challenge:/srv/acme-challenge:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ebay_bot_data:
  ebay_redis_data:
  caddy_data:
  caddy_config:
