# Отдельный проект: не пересекается с ~/cdek-bot
name: ebay-poshmark-bot

services:
  bot:
    build: .
    container_name: ebay-poshmark-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ebay_bot_data:/app/data
    ports:
      # Хостовый порт 18080 — чтобы не конфликтовать с другими сервисами на 8080
      - "18080:8080"
    environment:
      DATABASE_PATH: /app/data/bot.db
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080

volumes:
  ebay_bot_data:
